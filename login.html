<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Base de Datos II</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="logo-container">
      <img src="arch/img/logo.png" alt="Logo" class="logo">
    </div>
    <div class="title-container"> 
      <h1>Base de Datos II</h1>
      <h3>ROMAN ROQUE JHON SMITH</h3>
    </div>
    <nav class="menu">
      <ul class="menu-list" id="menu-list">
        <li><a href="index.html" class="menu-item">Inicio</a></li>
        <li><a href="semanas.html" class="menu-item">Semanas</a></li>
        <li><a href="#" id="logout-link" style="display:none;">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main class="principal">
    <section class="login-section">
      <div class="login-card">
        <div class="login-header">
          <h2>Iniciar Sesión</h2>
          <p>Accede a tu cuenta para gestionar el contenido</p>
        </div>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <span class="input-icon">👤</span>
          </div>
          
          <div class="form-group">
            <input type="password" id="contrasena" placeholder="Contraseña" required>
            <span class="input-icon">🔒</span>
          </div>
          
          <button type="submit" class="btn-login">
            <span>Ingresar</span>
            <div class="btn-loader"></div>
          </button>
        </form>
        
        <p id="mensaje" class="login-message"></p>
        
        
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 - Proyecto Base de Datos II</p>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const usuario = document.getElementById("usuario").value;
      const contrasena = document.getElementById("contrasena").value;
      
      const btn = document.querySelector('.btn-login');
      const loader = btn.querySelector('.btn-loader');
      const btnText = btn.querySelector('span');
      
      // Mostrar loading
      btnText.textContent = 'Ingresando...';
      loader.style.display = 'block';
      btn.disabled = true;

      try {
        const res = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, contrasena })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem("rol", data.rol);
          localStorage.setItem("usuario", data.usuario || usuario);

          // Mensaje de éxito con estilo
          document.getElementById("mensaje").textContent = `✅ Bienvenido ${data.rol === "admin" ? "Administrador" : "Usuario"} ${usuario}`;
          document.getElementById("mensaje").style.color = "#10b981";
          
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } else {
          document.getElementById("mensaje").textContent = "❌ Usuario o contraseña incorrectos";
          document.getElementById("mensaje").style.color = "#ef4444";
        }
      } catch (err) {
        document.getElementById("mensaje").textContent = "❌ Error de conexión con el servidor";
        document.getElementById("mensaje").style.color = "#ef4444";
      } finally {
        // Restaurar botón
        btnText.textContent = 'Ingresar';
        loader.style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
